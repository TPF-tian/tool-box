# ============================================================================
# ToolBox nginx 完整配置示例
# 适用于 Debian / Ubuntu + nginx, 把下面的内容粘到 /etc/nginx/sites-available/
# 里的某个文件, 然后 ln -s 到 sites-enabled/, 最后 nginx -t && nginx -s reload
#
# 使用前请把 server_name 和 alias 路径改成你自己的
# ============================================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # SSL 证书 (用 certbot 申请)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # 静态站点根目录
    root /var/www/tool-box;
    index index.html;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;
    gzip_vary on;

    # ---------- AI 模型 / OCR 资源: 1 年强缓存 ----------
    location /models/ {
        alias /var/www/tool-box/models/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location /tesseract/ {
        alias /var/www/tool-box/tesseract/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---------- JS / CSS / 字体: 30 天缓存 (vite 已自带 hash) ----------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- AI 抠图后端反代 ----------
    location /api/remove-bg {
        proxy_pass http://127.0.0.1:8000/remove-bg;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  20m;
        proxy_buffering          off;
        proxy_request_buffering  off;
    }

    location /api/remove-bg/health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

# ----------------------------------------------------------------------------
# 验证命令:
#   1. nginx -t                  # 检查语法
#   2. nginx -s reload           # 热重载
#   3. curl -I https://your-domain.com/models/        # 看缓存头
#   4. curl -I https://your-domain.com/api/remove-bg/health
# ----------------------------------------------------------------------------
