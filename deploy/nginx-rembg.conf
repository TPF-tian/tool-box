# ============================================================================
# nginx 反代配置 (ToolBox 证件照 AI 抠图后端)
# 粘到你的 server { } 块里, 跟其它 location 同级
#
# 假设你的 server_name 是你自己的域名, 后端是 uvicorn / gunicorn 跑的
# Python rembg 服务, 监听 127.0.0.1:8000
# ============================================================================

# 证件照 AI 抠图 (后端是 Python rembg 服务)
location /api/remove-bg {
    proxy_pass http://127.0.0.1:8000/remove-bg;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # rembg 跑一张 1024x768 大概要 2-5 秒, 给 60s 兜底
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # 客户端发的图片最大 20MB (跟服务端的 413 限制对齐)
    client_max_body_size 20m;

    # 关掉 buffering, 让 5xx 错误能立刻透传给前端
    proxy_buffering off;
    proxy_request_buffering off;
}

# 健康检查 (可选, 给监控用)
location /api/remove-bg/health {
    proxy_pass http://127.0.0.1:8000/health;
    access_log off;
}
